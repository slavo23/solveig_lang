[package]
name = "lang_experiments"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

core = { path = "core", version = "0.1.0" }
surface = { path = "surface", version = "0.1.0" }
syntax = { path = "syntax", version = "0.1.0" }
base = { path = "base", version = "0.1.0" }
chumsky = { version = "0.12.0", features = ["pratt"] }
slab = "0.4.12"
petgraph = "0.8.3"
clap = { version = "4.6.0", features = ["derive"] }


[workspace]
members = ["core", "syntax"]

[workspace.dependencies]
slab = "0.4.12"
petgraph = "0.8.3"
