[package]
name = "solveig"
version = "0.1.0"
edition = "2024"
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
solveig-base = { path = "crates/solveig-base", version = "0.1.0" }
solveig-driver = { path = "crates/solveig-driver", version = "0.1.0" }
solveig-fmt = { path = "crates/solveig-fmt", version = "0.1.0" }
solveig-ide = { path = "crates/solveig-ide", version = "0.1.0" }
solveig-lsp = { path = "crates/solveig-lsp", version = "0.1.0" }
solveig-package = { path = "crates/solveig-package", version = "0.1.0" }
solveig-report = { path = "crates/solveig-report", version = "0.1.0" }
solveig-syntax = { path = "crates/solveig-syntax", version = "0.1.0" }
clap = { version = "4.6.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = "0.7"
insta = "1"
pretty_assertions = "1"
solveig-ast = { path = "crates/solveig-ast", version = "0.1.0" }
solveig-vm = { path = "crates/solveig-vm", version = "0.1.0" }
tempfile = "3"

[[bin]]
name = "solveig"
path = "src/main.rs"
test = false

[[bench]]
name = "language"
harness = false

[[bench]]
name = "vm"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

[workspace]
members = [
    "crates/solveig-ast",
    "crates/solveig-base",
    "crates/solveig-check",
    "crates/solveig-driver",
    "crates/solveig-fmt",
    "crates/solveig-ide",
    "crates/solveig-lsp",
    "crates/solveig-lower",
    "crates/solveig-package",
    "crates/solveig-report",
    "crates/solveig-resolve",
    "crates/solveig-syntax",
    "crates/solveig-vm",
]

[workspace.dependencies]
camino = { version = "1.2.1", features = ["serde1"] }
ena = "0.14.4"
la-arena = "0.3.1"
petgraph = "0.8.3"
pretty = "0.12.5"
proptest = "1"
rustc-hash = "2.1.1"
serde = { version = "1", features = ["derive"] }
smallvec = "1.15.2"
text-size = "1.1.1"
thiserror = "2"
toml = "1.1.4"

[workspace.lints.clippy]
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
cast_possible_truncation = "warn"
invalid_upcast_comparisons = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
items_after_statements = "warn"
match_same_arms = "warn"
map_unwrap_or = "warn"

[profile.test.package.solveig]
opt-level = 1

[profile.test.package.solveig-ast]
opt-level = 1

[profile.test.package.solveig-base]
opt-level = 1

[profile.test.package.solveig-check]
opt-level = 1

[profile.test.package.solveig-driver]
opt-level = 1

[profile.test.package.solveig-fmt]
opt-level = 1

[profile.test.package.solveig-ide]
opt-level = 1

[profile.test.package.solveig-lower]
opt-level = 1

[profile.test.package.solveig-lsp]
opt-level = 1

[profile.test.package.solveig-package]
opt-level = 1

[profile.test.package.solveig-report]
opt-level = 1

[profile.test.package.solveig-resolve]
opt-level = 1

[profile.test.package.solveig-syntax]
opt-level = 1

[profile.test.package.solveig-vm]
opt-level = 1

[profile.samply]
inherits = "release"
debug = 2
