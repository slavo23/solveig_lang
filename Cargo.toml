[package]
name = "solveig"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
solveig-driver = { path = "crates/solveig-driver", version = "0.1.0" }
solveig-report = { path = "crates/solveig-report", version = "0.1.0" }
clap = { version = "4.6.0", features = ["derive"] }


[workspace]
members = [
    "crates/solveig-ast",
    "crates/solveig-base",
    "crates/solveig-check",
    "crates/solveig-driver",
    "crates/solveig-lower",
    "crates/solveig-report",
    "crates/solveig-resolve",
    "crates/solveig-syntax",
    "crates/solveig-vm",
]

[workspace.dependencies]
petgraph = "0.8.3"

[profile.samply]
inherits = "release"
debug = 2
