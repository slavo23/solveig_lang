[package]
name = "solveig"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
solveig-driver = { path = "crates/solveig-driver", version = "0.1.0" }
solveig-lsp = { path = "crates/solveig-lsp", version = "0.1.0" }
solveig-report = { path = "crates/solveig-report", version = "0.1.0" }
clap = { version = "4.6.0", features = ["derive"] }

[dev-dependencies]
solveig-base = { path = "crates/solveig-base", version = "0.1.0" }
solveig-ide = { path = "crates/solveig-ide", version = "0.1.0" }
solveig-syntax = { path = "crates/solveig-syntax", version = "0.1.0" }

[lints]
workspace = true

[workspace]
members = [
    "crates/solveig-ast",
    "crates/solveig-base",
    "crates/solveig-check",
    "crates/solveig-driver",
    "crates/solveig-ide",
    "crates/solveig-lsp",
    "crates/solveig-lower",
    "crates/solveig-report",
    "crates/solveig-resolve",
    "crates/solveig-syntax",
    "crates/solveig-vm",
]

[workspace.dependencies]
ena = "0.14.4"
la-arena = "0.3.1"
petgraph = "0.8.3"
rustc-hash = "2.1.1"
text-size = "1.1.1"

[workspace.lints.clippy]
needless_pass_by_value = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
items_after_statements = "warn"
match_same_arms = "warn"
map_unwrap_or = "warn"

[profile.samply]
inherits = "release"
debug = 2
