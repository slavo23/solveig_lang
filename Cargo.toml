[package]
name = "solveig_lang"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

core = { path = "core", version = "0.1.0" }
surface = { path = "surface", version = "0.1.0" }
syntax = { path = "syntax", version = "0.1.0" }
lowering = { path = "lowering", version = "0.1.0" }
runtime = { path = "runtime", version = "0.1.0" }
base = { path = "base", version = "0.1.0" }
petgraph = "0.8.3"
clap = { version = "4.6.0", features = ["derive"] }


[workspace]
members = ["base", "core", "lowering", "runtime", "surface", "syntax"]

[workspace.dependencies]
slab = "0.4.12"
petgraph = "0.8.3"

[profile.samply]
inherits = "release"
debug = 2
