[package]
name = "solveig-lsp"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[features]
ide-tests = []

[dependencies]
solveig-base = { path = "../solveig-base", version = "0.1.0" }
solveig-driver = { path = "../solveig-driver", version = "0.1.0" }
solveig-ide = { path = "../solveig-ide", version = "0.1.0" }
solveig-package = { path = "../solveig-package", version = "0.1.0" }
async-lsp = { version = "0.2.4", features = ["tokio"] }
tokio = { version = "1.48.0", features = ["io-std", "macros", "rt", "time"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1.48.0", features = ["io-std", "macros", "rt", "test-util", "time"] }

[lints]
workspace = true
